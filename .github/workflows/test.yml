name: "Test"
on:
  pull_request:
  push:
    branches:
      - staging
      - 'v*'

jobs:
  with-code-scanning:
    name: With GitHub Code Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Analyze Terraform or Tofu
        uses: ./
        with:
          working-directory: ./__tests__

      - name: Confirm High/Critical Findings Did Not Stop the Job
        run: echo 'Terraform analysis completed without gating.'

  without-code-scanning-permission:
    name: Without GitHub Code Scanning Permission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Intentionally omit security-events: write to test the best-effort SARIF upload path.
    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Analyze Terraform or Tofu
        uses: ./
        with:
          working-directory: ./__tests__

      - name: Confirm Missing Upload Permission Did Not Stop the Job
        run: echo 'Tofu analysis completed without gating.'
