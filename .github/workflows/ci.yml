name: CI
on:
  pull_request:
  push:
    branches:
      - staging
      - 'v*'

jobs:
  validate:
    name: Validate Composite Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check SARIF Path Normalizer Syntax
        run: node --check scripts/rebase-sarif.js
